# Casbin RBAC model — hierarki role + object glob + bypass root.
#
# sub = role (string dari users.role). obj = "<panel>:<section>:<target>".
# act = verb ("read"/"create"/"delete"/"manage"/"*").
#
# g = role inheritance (RBAC1): child mewarisi izin parent.
# keyMatch = glob prefix pada obj (mis. "admin:users:*" cocok "admin:users:btn-x").
# Cabang || g(r.sub,"root") = super_admin god-mode (super_admin -> root di policy).

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && (r.act == p.act || p.act == "*") || g(r.sub, "root")
