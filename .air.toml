root = "."
tmp_dir = "tmp"

[build]
# Regenerate CSS (scan class di .go) + sqlc + build.
# sqlc via path absolut GOPATH/bin: air menjalankan cmd lewat `/bin/sh -c`,
# tapi PATH warisan belum tentu memuat GOPATH/bin (sama seperti gotcha Makefile).
# `$(go env GOPATH)` di-expand shell; `go` sudah pasti di PATH.
cmd = "./tailwindcss -i static/input.css -o static/app.css --minify && $(go env GOPATH)/bin/sqlc generate && go build -o ./tmp/app ."
bin = "./tmp/app"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "static", "internal/db"]
# CATATAN: sengaja TIDAK menjalankan `go test` di loop reload (lambat).
# Jalankan `make check` manual setelah perubahan (§6).
delay = 300
stop_on_error = true

[misc]
clean_on_exit = true
